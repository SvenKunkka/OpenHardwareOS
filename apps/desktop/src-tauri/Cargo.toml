[package]
name = "ohm-desktop"
description = "OpenHardwareOS desktop application (Tauri v2 backend)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ohm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ohm-core.workspace = true
ohm-device-model.workspace = true
ohm-adapter-api.workspace = true
ohm-runtime.workspace = true
ohm-automation.workspace = true
ohm-protocol.workspace = true
ohm-adapters.workspace = true
ohm-adapter-mock.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true

tauri = { version = "2", features = ["tray-icon"] }

[dev-dependencies]
tempfile.workspace = true
