<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>OpenHardwareOS</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M8 21c3.5 0 4-11 8-11s3.5 11 8 11' fill='none' stroke='%234c8dff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the stored/system theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = window.localStorage.getItem('ohm.theme') || 'system';
          var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          var resolved = stored === 'system' ? system : stored;
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-theme-mode', stored);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
