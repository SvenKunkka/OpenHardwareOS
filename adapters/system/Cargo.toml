[package]
name = "ohm-adapter-system"
description = "Cross platform OS level sensors: CPU name/load, memory, disks, thermal zones"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `statvfs` for the free-space reading: the answer has to be the one `df` prints, and
# the library helper answers a different question on macOS (see `available_bytes`).
# `rustix` is already in the tree, and its wrapper keeps this crate free of `unsafe`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }
ohm-core.workspace = true
ohm-device-model.workspace = true
ohm-adapter-api.workspace = true
serde.workspace = true
async-trait.workspace = true
tracing.workspace = true
parking_lot.workspace = true
sysinfo.workspace = true

[target.'cfg(windows)'.dependencies]
wmi.workspace = true

[dev-dependencies]
tokio.workspace = true
tempfile.workspace = true

[lints]
workspace = true
