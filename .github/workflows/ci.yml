name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_TOOLCHAIN: 1.98.1

permissions:
  contents: read

jobs:
  versions:
    name: Version catalogue and lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check catalogue and generated views
        run: python -B scripts/versions.py check --generated
      - name: Test version changes and publication checks
        run: python -B -m unittest discover -s scripts/tests -p test_versions.py -v

  # Formatting and lints are *required*: a warning tolerated silently is a warning
  # nobody fixes. The machine this repository was developed on had a split
  # toolchain (Homebrew's clippy-driver could not build `sysinfo`), so local clippy
  # could not see the whole workspace; here the toolchain is a matching pair, which
  # makes CI the authoritative check.
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Clippy compiles the desktop crate, which links against WebKitGTK.
      # Package list from https://v2.tauri.app/start/prerequisites/ (Debian/Ubuntu).
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The runtime, adapters, automation engine and CLI on every supported OS. This
  # is the part that must pass everywhere, with no controllable hardware: the
  # simulated provider covers the whole cooling loop.
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Note: this works on a clean checkout. `tauri.conf.json` points
      # `frontendDist` at `../dist`, and Tauri's codegen tolerates that directory
      # not existing at compile time, so the Rust build does not depend on a
      # prebuilt frontend. The bundle job below does build it.
      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace --no-fail-fast

      - name: Headless closed loop (acceptance scenario C)
        shell: bash
        run: |
          export OHM_CONFIG_DIR="$RUNNER_TEMP/ohm-ci"
          cargo run -q -p ohm-cli -- demo --steps 60 --profile gaming
          cargo run -q -p ohm-cli -- doctor --mock

      - name: Desktop self test (headless launch, simulated hardware)
        shell: bash
        run: |
          export OHM_CONFIG_DIR="$RUNNER_TEMP/ohm-ci-desktop"
          cargo run -q -p ohm-desktop -- --selftest --mock

      - name: Desktop self test in dry-run (no write may reach hardware)
        shell: bash
        run: |
          export OHM_CONFIG_DIR="$RUNNER_TEMP/ohm-ci-dry"
          cargo run -q -p ohm-desktop -- --selftest --mock --dry-run

  # The desktop UI: type check, behaviour tests, production build.
  frontend:
    name: Desktop UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Type check
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Behaviour tests
        working-directory: apps/desktop
        run: npm run test

      - name: Build
        working-directory: apps/desktop
        run: npm run build

  # The Windows installer. Building it is the only way to know that the bundle
  # configuration, the icons and the NSIS packaging actually work.
  #
  # The bundle lands in the *workspace* target directory (`<repo>/target`), not in
  # `apps/desktop/src-tauri/target`, because this is a Cargo workspace. The path is
  # taken from `cargo metadata` rather than hardcoded, so the two can never drift
  # apart again. The artifact is kept for review and is *not* published anywhere.
  windows-bundle:
    name: Windows bundle (NSIS)
    runs-on: windows-latest
    outputs:
      target_dir: ${{ steps.workspace.outputs.target_dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Read the workspace target directory
        id: workspace
        shell: pwsh
        run: |
          $meta = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $target = $meta.target_directory
          Write-Host "workspace target directory: $target"
          "target_dir=$target" >> $env:GITHUB_OUTPUT

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build the installer
        working-directory: apps/desktop
        run: npx tauri build --ci -- --locked

      - name: Report what was produced
        shell: pwsh
        env:
          TARGET_DIR: ${{ steps.workspace.outputs.target_dir }}
        run: |
          $bundleRoot = Join-Path $env:TARGET_DIR 'release/bundle'
          Write-Host "bundle root: $bundleRoot"
          if (-not (Test-Path $bundleRoot)) {
            Write-Error "no bundle directory at $bundleRoot — the packaging configuration or the target path changed"
            exit 1
          }
          Get-ChildItem -Recurse -Path $bundleRoot |
            Where-Object { -not $_.PSIsContainer } |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Upload the installer for review
        uses: actions/upload-artifact@v4
        with:
          name: openhardwareos-windows-nsis
          path: ${{ steps.workspace.outputs.target_dir }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # Licensing and dependency hygiene. The project may not ship code it cannot
  # redistribute (see docs/decisions/0002-license.md and 0004-vendor-sdks-and-amd.md).
  hygiene:
    name: Licence and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Forbid unsafe code outside the allow-list
        shell: bash
        run: |
          if grep -rn '^unsafe_code = "allow"' --include=Cargo.toml .; then
            echo "::error::a crate allows unsafe code; see CONTRIBUTING.md"
            exit 1
          fi
          echo "no crate allows unsafe code"

      - name: Forbid vendored vendor SDKs
        shell: bash
        run: |
          # ADL/ADLX may not appear anywhere in the shipped tree; see ADR 0004.
          if grep -rniE "adl_|adlx|atiadlxx" --include="*.rs" --include="*.toml" --include="*.json" . \
             | grep -v "^./docs/" | grep -v "^./README.md" | grep -v "^./deny.toml"; then
            echo "::error::AMD vendor SDK references are not allowed in code"
            exit 1
          fi
          echo "no AMD vendor SDK references"

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Dependency licences, advisories and sources
        run: cargo deny check
