name: Windows release assets

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Explicit vMAJOR.MINOR.PATCH matching the checked-out source
        required: true
        type: string

# This workflow builds artifacts for review. The maintainer publishes the
# successful run's artifacts as a GitHub Release after checking its commit SHA.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_TOOLCHAIN: 1.98.1

jobs:
  windows:
    name: Windows x64 build and package
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version catalogue and generated views
        run: python -B scripts/versions.py check --generated
      - name: Test version lifecycle and synchronization
        run: python -B -m unittest discover -s scripts/tests -p test_versions.py -v
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify release version and toolchain
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected version vMAJOR.MINOR.PATCH' }
          $meta = cargo metadata --locked --format-version 1 --no-deps | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          foreach ($package in $meta.packages) {
            if ("v$($package.version)" -ne $env:RELEASE_VERSION) { throw "Version mismatch: $($package.name)" }
          }
          $tauri = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ("v$($tauri.version)" -ne $env:RELEASE_VERSION) { throw 'Desktop version mismatch' }
          rustc --version
          cargo --version
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Frontend tests
        working-directory: apps/desktop
        run: npm test
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Windows workspace tests
        run: cargo test --locked --workspace --no-fail-fast --target x86_64-pc-windows-msvc
      - name: Windows clippy
        run: cargo clippy --locked --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Build CLI
        run: cargo build --locked --release -p ohm-cli --target x86_64-pc-windows-msvc
      - name: Build desktop NSIS installer
        working-directory: apps/desktop
        run: npx tauri build --ci --target x86_64-pc-windows-msvc -- --locked
      - name: Generate dependency notices
        run: python scripts/release/generate-notices.py --output artifacts/THIRD_PARTY_NOTICES.txt
      - name: Test installer behavior with isolated fixtures
        shell: pwsh
        run: ./scripts/release/test-install.ps1
      - name: Test packaging behavior with isolated fixtures
        shell: pwsh
        run: ./scripts/release/test-packaging.ps1
      - name: Package verified build outputs
        shell: pwsh
        run: ./scripts/release/package-windows.ps1 -Version $env:RELEASE_VERSION
      - name: Install and run the actual packaged CLI in isolation
        shell: pwsh
        run: ./scripts/release/smoke-windows-install.ps1 -ReleaseVersion $env:RELEASE_VERSION
      - name: Upload release assets for review
        uses: actions/upload-artifact@v4
        with:
          name: OpenHardwareOS-${{ env.RELEASE_VERSION }}-windows-x86_64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

  # The Linux CLI, built and packaged on the platform it targets. Its packaging
  # script is fixture-tested first (the same rule the Windows job follows), and
  # the binary is executed after packaging so the archive is known to contain a
  # program that runs and reports the version it claims.
  linux:
    name: Linux x64 build and package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      # The workspace includes the desktop crate, so a Linux test run needs the
      # same GTK/WebKit development packages the CI job installs; without them
      # `glib-sys` fails in its build script before a single test runs.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            zstd
          # The AppImage tooling mounts itself through FUSE; the package is named
          # differently on 22.04 and 24.04, and neither is required to *build*
          # (APPIMAGE_EXTRACT_AND_RUN covers that), so a miss is not fatal.
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version catalogue and generated views
        run: python -B scripts/versions.py check --generated
      - name: Test version lifecycle and synchronization
        run: python -B -m unittest discover -s scripts/tests -p test_versions.py -v
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify release version and toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vMAJOR.MINOR.PATCH"; exit 1; }
          manifest_version=$(python -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          [ "v$manifest_version" = "$RELEASE_VERSION" ] || { echo "Workspace version $manifest_version differs from $RELEASE_VERSION"; exit 1; }
          rustc --version
          cargo --version
      - name: Frontend tests
        working-directory: apps/desktop
        run: |
          npm ci
          npm test
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Workspace tests
        run: cargo test --locked --workspace --no-fail-fast
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test the Linux packager with isolated fixtures
        run: ./scripts/tests/package-linux.test.sh
      - name: Test the documented install route with isolated fixtures
        run: ./scripts/tests/linux-install-doc.test.sh
      - name: Build CLI
        run: cargo build --locked --release -p ohm-cli
      # The GUI stack is built here, not only compiled for tests: a desktop package
      # that has never been assembled is a promise, not a deliverable.
      - name: Build desktop bundles (Debian package and AppImage)
        working-directory: apps/desktop
        env:
          # appimagetool is itself an AppImage; without FUSE it must extract first.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npx tauri build --ci --bundles deb,appimage -- --locked
      - name: Generate dependency notices
        run: python scripts/release/generate-notices.py --output artifacts/THIRD_PARTY_NOTICES.txt
      - name: Package verified build outputs
        shell: bash
        run: |
          set -euo pipefail
          deb="$(ls target/release/bundle/deb/*.deb)"
          image="$(ls target/release/bundle/appimage/*.AppImage)"
          echo "bundler produced: $deb"
          echo "bundler produced: $image"
          ./scripts/release/package-linux.sh --version "$RELEASE_VERSION" \
            --binary target/release/ohm-cli \
            --desktop-deb "$deb" --desktop-appimage "$image" --run-binary
      # The evidence that matters for "installable without compiling": install the
      # package the way the install page says to, on a distribution and kernel this
      # run reports, and run the installed binary with simulated hardware.
      - name: Install the packaged Debian package and run the installed application
        shell: bash
        run: |
          set -euo pipefail
          echo "runner distribution and kernel:"
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          uname -r
          deb="$(ls artifacts/release/OpenHardwareOS-*-linux-x86_64.deb)"
          # apt, not dpkg: the package declares its dependencies and apt resolves
          # them, which is what a user following the install page does.
          sudo apt-get install -y "$deb"
          installed="$(python3 scripts/release/inspect-deb.py "$deb" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["binary"])')"
          echo "installed as /$installed"
          ls -l "/$installed"
          export OHM_CONFIG_DIR="$RUNNER_TEMP/ohm-deb-selftest"
          "/$installed" --selftest --mock
          export OHM_CONFIG_DIR="$RUNNER_TEMP/ohm-deb-selftest-dry"
          "/$installed" --selftest --mock --dry-run
          echo "the installed desktop application started, read simulated hardware and exited"
      - name: Run the packaged AppImage
        shell: bash
        run: |
          set -euo pipefail
          image="$(ls artifacts/release/OpenHardwareOS-*-linux-x86_64.AppImage)"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export OHM_CONFIG_DIR="$RUNNER_TEMP/ohm-appimage-selftest"
          "$image" --selftest --mock
          echo "the packaged AppImage started, read simulated hardware and exited"
      - name: Upload release assets for review
        uses: actions/upload-artifact@v4
        with:
          name: OpenHardwareOS-${{ env.RELEASE_VERSION }}-linux-x86_64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30
