# The compiler the release is built and tested with.
#
# Pinning it here means a rustup-managed `cargo` — CI, a fresh checkout, the
# Windows acceptance machine — resolves the same release, so it cannot silently
# be a different compiler than the one that produced a published artefact.
# A cargo binary that is *not* a rustup shim bypasses this file entirely: on the
# development machine `/opt/homebrew/bin/cargo` comes first on PATH, which is why
# the round-6 verification pass invokes `rustup run 1.98.1` explicitly and why
# the acceptance pre-check refuses a `clippy`/`rustc` pair from different
# releases. CI also sets RUSTUP_TOOLCHAIN explicitly; the two must agree.
#
# `rust-version` in Cargo.toml stays the *minimum* the crates compile with
# (1.95); this file is the *exact* toolchain used for release verification.
# An explicit `-Toolchain <name>` in the Windows acceptance scripts still wins,
# because RUSTUP_TOOLCHAIN takes precedence over this file.
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
profile = "minimal"
