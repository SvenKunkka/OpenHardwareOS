<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>OpenHardwareOS · 版本管理树</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6fa; --surface: #ffffff; --text: #172238; --muted: #546278;
      --border: #dce2ec; --soft: #f0f3f8; --accent: #305de1; --selected: #ebf0ff;
      --green: #166847; --green-bg: #e8f4ec; --amber: #855316; --amber-bg: #fff3df;
      --blue: #254dc3; --blue-bg: #eaf0ff; --shadow: 0 12px 50px #24344e08;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111824; --surface:#192231; --text:#e8edf6; --muted:#aab7cc;
        --border:#354257; --soft:#222e40; --accent:#9db5ff; --selected:#243858;
        --green:#9fe2b6; --green-bg:#203e32; --amber:#f2cd8d; --amber-bg:#44351e;
        --blue:#adc2ff; --blue-bg:#293959; --shadow:none; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); line-height:1.65; }
    button, input { font:inherit; }
    button, a { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; }
    a { color:var(--accent); text-underline-offset:3px; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    [hidden] { display:none !important; }
    .wrap { max-width:1180px; margin:0 auto; padding:32px 28px 44px; }
    .brand { display:flex; align-items:center; gap:12px; font-size:14px; font-weight:650; letter-spacing:.02em; }
    .mark { display:grid; place-items:center; width:34px; height:34px; background:var(--text); color:var(--surface); border-radius:10px; font-size:12px; letter-spacing:-.03em; }

    .hero p { margin:0; color:var(--muted); font-size:14px; }
    .legend { margin-left:auto; display:flex; flex-wrap:wrap; gap:15px; font-size:12px; color:var(--muted); }
    .legend span { display:flex; align-items:center; gap:6px; }
    .dot { width:7px; height:7px; display:inline-block; background:currentColor; border-radius:50%; flex:none; }
    .released { color:var(--green); }
    .development { color:var(--blue); }
    .planned { color:var(--amber); }
    .workspace { display:grid; grid-template-columns:minmax(270px, 340px) minmax(0, 1fr); border:1px solid var(--border); border-radius:18px; overflow:hidden; background:var(--surface); box-shadow:var(--shadow); min-height:540px; }
    .navigation { border-right:1px solid var(--border); padding:22px 16px; }
    .nav-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 6px 16px; }
    .nav-heading h2 { font-size:13px; margin:0; font-weight:650; }
    .text-button { background:none; border:0; padding:4px 2px; color:var(--accent); font-size:12px; }
    .search-label { display:block; font-size:12px; color:var(--muted); margin:0 6px 6px; }
    .search { border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); padding:9px 11px; width:100%; font-size:13px; }
    .tree { padding:16px 0 0; margin:0; list-style:none; }
    .tree ul { list-style:none; margin:3px 0 3px 15px; padding:0 0 0 10px; border-left:1px solid var(--border); }
    .node-row { display:flex; align-items:stretch; position:relative; border-radius:9px; margin:3px 0; }
    .node-row:hover { background:var(--soft); }
    .node-row.selected { background:var(--selected); }
    .fold { align-self:flex-start; border:0; background:none; color:var(--muted); width:25px; flex:none; padding:12px 0; font-size:13px; line-height:1.5; }
    .fold.empty { cursor:default; visibility:hidden; }
    .node { min-width:0; flex:1; border:0; text-align:left; background:none; color:var(--text); padding:10px 10px 10px 0; border-radius:7px; }
    .node-top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .node-version { font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:15px; font-weight:650; }
    .node-status { font-size:10px; display:flex; align-items:center; gap:5px; }
    .node-label { display:block; font-size:12px; color:var(--muted); margin-top:4px; overflow-wrap:anywhere; }
    .context-node { opacity:.62; }
    .nav-note { font-size:11px; color:var(--muted); margin:22px 6px 0; }
    .empty-state { padding:24px 6px; font-size:13px; color:var(--muted); }
    .detail { min-width:0; padding:30px 34px; }
    .detail-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .badge { display:inline-flex; align-items:center; gap:6px; border-radius:5px; padding:3px 8px; font-size:11px; background:var(--soft); color:var(--muted); }
    .badge.released { color:var(--green); background:var(--green-bg); }
    .badge.development { color:var(--blue); background:var(--blue-bg); }
    .badge.planned { color:var(--amber); background:var(--amber-bg); }
    .version-heading { margin:18px 0 3px; display:flex; align-items:center; flex-wrap:wrap; gap:12px; }

    .detail h3 { margin:7px 0 10px; font-size:18px; letter-spacing:-.02em; font-weight:650; }
    .summary { margin:0; color:var(--muted); font-size:14px; line-height:1.85; overflow-wrap:anywhere; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin:22px 0 27px; }
    .action { display:inline-flex; align-items:center; min-height:36px; padding:6px 13px; border:1px solid var(--border); border-radius:7px; text-decoration:none; color:var(--text); background:var(--surface); font-size:12px; font-weight:600; }
    .action.primary { background:var(--text); color:var(--surface); border-color:var(--text); }

    .metadata dt { color:var(--muted); }
    .metadata dd { margin:0; overflow-wrap:anywhere; }
    .metadata code { font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:11px; }
    .subtle { margin:0; color:var(--muted); font-size:12px; line-height:1.8; }
    .child-links { display:flex; gap:8px; flex-wrap:wrap; }

    .error { padding:24px; background:var(--surface); border:1px solid var(--border); border-radius:12px; }

      .navigation { border-right:0; border-bottom:1px solid var(--border); }
      .detail { padding:25px 22px; }
      .nav-note { display:none; }
      .tree { padding-top:10px; }
      .footer { display:block; }
      .footer span { display:block; margin-bottom:8px; }
    }
    @media(prefers-reduced-motion:no-preference) {
      .node-row, .action { transition:background-color .15s ease, color .15s ease; }
    }
  </style>
</head>

<main class="wrap">
  <div class="brand"><span class="mark" aria-hidden="true">OH</span><span>OpenHardwareOS</span><a id="repository-link" href="https://github.com/SvenKunkka/OpenHardwareOS" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div>

    </aside>
    <article class="detail" id="version-detail" aria-labelledby="selected-version">
      <div class="detail-top"><span class="badge" id="selected-status"></span><span class="badge" id="selected-channel"></span></div>
      <div class="version-heading"><h2 id="selected-version"></h2><button class="text-button" id="copy-version" type="button">复制版本号</button></div>
      <h3 id="selected-title"></h3>
      <p class="summary" id="selected-summary"></p>
      <nav class="actions" id="version-actions" aria-label="当前版本相关链接"></nav>
      <section class="section"><h4>变更范围</h4><ul class="change-list" id="changes"></ul></section>
      <section class="section"><h4>发布与验证</h4><dl class="metadata" id="metadata"></dl></section>
      <section class="section"><h4>验证记录</h4><ul class="evidence-list" id="evidence"></ul><p class="subtle" id="no-evidence"></p></section>
      <section class="section" id="next-section"><h4>后续版本</h4><div class="child-links" id="children"></div></section>
      <p id="notice" role="status" aria-live="polite"></p>
    </article>
  </div>
  <footer class="footer">
    <span>版本清单随源码保存。计划中的功能不会显示为可下载版本。</span>
    <span><a href="https://github.com/SvenKunkka/OpenHardwareOS/blob/main/docs/version-management.md" target="_blank" rel="noopener noreferrer">维护说明</a> · <a href="https://github.com/SvenKunkka/OpenHardwareOS/blob/main/docs/versions.json" target="_blank" rel="noopener noreferrer">版本清单</a></span>
  </footer>
</main>

    anchor.href = safe; anchor.target = '_blank'; anchor.rel = 'noopener noreferrer';
    return anchor;
  }
  function descendants(id) { return data.versions.filter(function (node) { return node.parent === id; }); }
  function matching(node) {
    return (node.id + ' ' + node.title + ' ' + node.summary + ' ' + (node.changes || []).join(' ')).toLocaleLowerCase().indexOf(query) !== -1;
  }
  function visibleBranch(node, seen) {
    if (seen.has(node.id)) return false;
    var visited = new Set(seen); visited.add(node.id);
    return matching(node) || descendants(node.id).some(function (child) { return visibleBranch(child, visited); });
  }
  function visibleItems() { return Array.from(tree.querySelectorAll('[role="treeitem"]')).filter(function (item) { return !item.closest('[hidden]'); }); }
  function focusNode(id) {
    var button = Array.from(tree.querySelectorAll('[role="treeitem"]')).find(function (item) { return item.dataset.version === id; });
    if (button) button.focus();
  }
  function select(id, focus) {
    if (!nodes.has(id)) return;
    selected = id;
    var parent = nodes.get(id).parent, guard = new Set();
    while (parent && nodes.has(parent) && !guard.has(parent)) { expanded.add(parent); guard.add(parent); parent = nodes.get(parent).parent; }
    try { history.replaceState(null, '', '#' + encodeURIComponent(id)); } catch (error) { /* The selection still works in restricted file viewers. */ }
    renderTree(); renderDetail();
    if (focus) focusNode(id);
  }
  function toggle(id) {
    if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
    renderTree(); focusNode(id);
  }
  function renderTree() {
    tree.replaceChildren();
    var count = 0;
    function append(node, host, level, visited) {
      if (visited.has(node.id) || !visibleBranch(node, new Set())) return;
      var nextVisited = new Set(visited); nextVisited.add(node.id);
      count += 1;
      var item = el('li'); item.setAttribute('role', 'none');
      var row = el('div', undefined, 'node-row' + (selected === node.id ? ' selected' : '') + (query && !matching(node) ? ' context-node' : ''));
      var children = descendants(node.id).filter(function (child) { return visibleBranch(child, new Set()); });
      var isExpanded = query ? true : expanded.has(node.id);
      var fold = el('button', children.length ? (isExpanded ? '▾' : '▸') : '', 'fold' + (children.length ? '' : ' empty'));
      fold.type = 'button'; fold.tabIndex = -1;
      fold.setAttribute('aria-label', (isExpanded ? '折叠 ' : '展开 ') + node.id);
      if (!children.length) { fold.disabled = true; fold.setAttribute('aria-hidden', 'true'); }
      fold.addEventListener('click', function () { toggle(node.id); });
      var button = el('button', undefined, 'node'); button.type = 'button';
      button.setAttribute('role', 'treeitem'); button.setAttribute('aria-level', String(level));
      button.setAttribute('aria-selected', String(selected === node.id));
      if (children.length) button.setAttribute('aria-expanded', String(isExpanded));
      button.tabIndex = selected === node.id ? 0 : -1; button.dataset.version = node.id;
      var top = el('span', undefined, 'node-top');
      top.append(el('span', node.id, 'node-version'));
      var status = el('span', undefined, 'node-status ' + node.status);
      var dot = el('i', undefined, 'dot'); dot.setAttribute('aria-hidden', 'true');
      status.append(dot, document.createTextNode(labels[node.status] || node.status));
      top.append(status); button.append(top, el('span', node.title, 'node-label'));
      button.addEventListener('click', function () { select(node.id, true); });
      button.addEventListener('focus', function () {
        visibleItems().forEach(function (item) { item.tabIndex = item === button ? 0 : -1; });
      });
      button.addEventListener('keydown', function (event) {
        var items = visibleItems(), index = items.indexOf(button), target;
        if (event.key === 'ArrowDown') target = items[Math.min(index + 1, items.length - 1)];
        if (event.key === 'ArrowUp') target = items[Math.max(index - 1, 0)];
        if (event.key === 'Home') target = items[0];
        if (event.key === 'End') target = items[items.length - 1];
        if (target) { event.preventDefault(); target.focus(); return; }
        if (event.key === 'ArrowRight' && children.length) {
          event.preventDefault();
          if (!isExpanded) toggle(node.id); else focusNode(children[0].id);
        }
        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          if (children.length && isExpanded && !query) toggle(node.id); else if (node.parent) focusNode(node.parent);
        }
      });
      row.append(fold, button); item.append(row); host.append(item);
      if (children.length) {
        var group = el('ul'); group.setAttribute('role', 'group'); group.hidden = !isExpanded;
        item.append(group);
        children.forEach(function (child) { append(child, group, level + 1, nextVisited); });
      }
    }
    data.versions.filter(function (node) { return !node.parent || !nodes.has(node.parent); }).forEach(function (node) { append(node, tree, 1, new Set()); });
    document.getElementById('empty').hidden = count !== 0;
    var items = visibleItems();
    if (items.length && !items.some(function (item) { return item.tabIndex === 0; })) items[0].tabIndex = 0;
  }
  function renderDetail() {
    var node = nodes.get(selected);
    document.getElementById('selected-version').textContent = node.id;
    document.getElementById('selected-title').textContent = node.title;
    document.getElementById('selected-summary').textContent = node.summary;
    var status = document.getElementById('selected-status');
    status.textContent = labels[node.status] || node.status; status.className = 'badge ' + node.status;
    var channel = document.getElementById('selected-channel');
    channel.hidden = node.status === 'planned';
    channel.textContent = node.channel === 'preview' ? '预览版' : node.channel === 'stable' ? '正式版' : '版本准备中';
    var actions = document.getElementById('version-actions'); actions.replaceChildren();
    function action(text, url, primary) { var anchor = link(text, url, 'action' + (primary ? ' primary' : '')); if (anchor) actions.append(anchor); }
    if (node.status === 'released' && node.release_url) {
      action('下载这个版本 ↗', node.release_url, true);
      action('Windows 安装说明', sourcePath('docs/windows-install.md', node.tag), false);
    }
    if (node.commit) action('查看源码', base + '/tree/' + encodeURIComponent(node.commit), false);
    else if (node.status === 'development' && node.branch) action('查看开发分支', base + '/tree/' + encodeURIComponent(node.branch), false);
    if (node.plan) action('查看开发计划 ↗', sourcePath(node.plan), node.status === 'planned');
    var changes = document.getElementById('changes'); changes.replaceChildren();
    (node.changes || []).forEach(function (change) { changes.append(el('li', change)); });
    var metadata = document.getElementById('metadata'); metadata.replaceChildren();
    function meta(label, text, code) {
      var value = el('dd');
      if (code) value.append(el('code', text)); else value.textContent = text;
      metadata.append(el('dt', label), value);
    }
    meta('发布状态', node.status === 'released' ? '已在 GitHub 发布' : node.status === 'development' ? '正在开发，尚未发布安装包' : '计划中，尚未开工');
    if (node.tag) meta('版本标签', node.tag, true);
    if (node.commit) meta('源码提交', node.commit, true);
    if (node.branch && node.status !== 'planned') meta('开发分支', node.branch, true);
    if (node.published_at) meta('发布日期', String(node.published_at).slice(0, 10));
    meta('实机验收', node.hardware_validation === 'verified' ? '已登记实机验证，请查阅下方证据范围' : node.hardware_validation === 'partial' ? '部分通过，完整范围见验证记录' : '待验证；软件测试不等于真实设备支持');
    var evidence = document.getElementById('evidence'); evidence.replaceChildren();
    (node.evidence || []).forEach(function (record) {
      var anchor = link(record.title, record.url);
      if (anchor) { var item = el('li'); item.append(anchor); evidence.append(item); }
    });
    var empty = document.getElementById('no-evidence');
    empty.hidden = evidence.childElementCount > 0;
    empty.textContent = node.status === 'planned' ? '本版本尚未进入验证阶段。' : '尚未登记此版本的验证结果。';
    var children = document.getElementById('children'); children.replaceChildren();
    var next = descendants(node.id);
    document.getElementById('next-section').hidden = next.length === 0;
    next.forEach(function (child) {
      var button = el('button', child.id + ' · ' + child.title + ' →', 'child-link'); button.type = 'button';
      button.addEventListener('click', function () { query = ''; document.getElementById('version-search').value = ''; select(child.id, true); });
      children.append(button);
    });
    document.getElementById('notice').textContent = '';
  }
  document.getElementById('version-search').addEventListener('input', function (event) {
    query = event.target.value.trim().toLocaleLowerCase(); renderTree();
  });
  document.getElementById('expand-all').addEventListener('click', function () {
    data.versions.forEach(function (node) { expanded.add(node.id); }); renderTree();
  });
  document.getElementById('copy-version').addEventListener('click', async function () {
    try { await navigator.clipboard.writeText(selected); document.getElementById('notice').textContent = '已复制 ' + selected; }
    catch (error) { document.getElementById('notice').textContent = '此浏览器不允许复制，可直接选中版本号复制。'; }
  });
  window.addEventListener('hashchange', function () {
    try { var id = decodeURIComponent(location.hash.slice(1)); if (nodes.has(id)) select(id, false); } catch (error) { /* Keep the current selection. */ }
  });
  renderTree(); renderDetail();
}());
</script>
